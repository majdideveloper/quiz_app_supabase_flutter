name: web_app
description: Web app for Formation Métiers
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Common Package
  common:
    path: ../common

  # Environment Configuration
  flutter_dotenv: ^5.2.1

  # Supabase
  supabase_flutter: ^2.0.0

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Video Player
  video_player_web: ^2.1.0

  # Responsive Design
  responsive_framework: ^1.1.0

  # URL Strategy (clean URLs without #)
  url_strategy: ^0.2.0

  # UI Components
  cached_network_image: ^3.3.0

  # Utilities
  equatable: ^2.0.5

flutter:
  assets:
    - assets/.env.develop

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  injectable_generator: ^2.4.0

  # Testing
  bloc_test: ^9.1.4
  mocktail: ^1.0.0

  # Linting
  flutter_lints: ^5.0.0
