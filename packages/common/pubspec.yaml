name: common
description: Common package containing domain and data layers
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.0.0

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.3.0

  # Functional Programming
  dartz: ^0.10.1

  # Immutable Data Classes
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.1

  # Environment Configuration
  flutter_dotenv: ^5.1.0

  # Logging
  logger: ^2.0.0

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  injectable_generator: ^2.4.0

  # Testing
  mockito: ^5.4.0
  mocktail: ^1.0.0

  # Linting
  flutter_lints: ^5.0.0
