name: formation_metiers
repository: https://github.com/your-username/formation_metiers

packages:
  - packages/**

command:
  version:
    updateGitTagRefs: true
    releaseUrl: true

  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    description: Run static analysis on all packages
    run: flutter analyze
    exec:
      concurrency: 1
      failFast: true

  test:
    description: Run tests on all packages
    run: flutter test
    exec:
      concurrency: 1
      failFast: true

  format:
    description: Format code across all packages
    run: dart format .
    exec:
      concurrency: 1

  format-check:
    description: Check code formatting
    run: dart format --set-exit-if-changed .
    exec:
      concurrency: 1

  clean:
    description: Clean all packages
    run: flutter clean
    exec:
      concurrency: 1

  get:
    description: Get dependencies for all packages
    run: flutter pub get
    exec:
      concurrency: 1

  build-runner:common:
    description: Run build_runner for common package
    run: flutter pub run build_runner build --delete-conflicting-outputs
    exec:
      scope: common

  build-runner:mobile:
    description: Run build_runner for mobile package
    run: flutter pub run build_runner build --delete-conflicting-outputs
    exec:
      scope: mobile

  build-runner:web:
    description: Run build_runner for web package
    run: flutter pub run build_runner build --delete-conflicting-outputs
    exec:
      scope: web

  build-runner:all:
    description: Run build_runner for all packages
    run: flutter pub run build_runner build --delete-conflicting-outputs
    exec:
      concurrency: 1

  watch-runner:common:
    description: Watch and run build_runner for common package
    run: flutter pub run build_runner watch --delete-conflicting-outputs
    exec:
      scope: common

  build:mobile:
    description: Build mobile APK
    run: flutter build apk
    exec:
      scope: mobile

  build:web:
    description: Build web app
    run: flutter build web
    exec:
      scope: web

  run:mobile:
    description: Run mobile app
    run: flutter run
    exec:
      scope: mobile

  run:web:
    description: Run web app
    run: flutter run -d chrome
    exec:
      scope: web
